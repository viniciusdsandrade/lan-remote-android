name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Testes, lint e APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Código
        uses: actions/checkout@v7

      - name: Nada de chave ou certificado versionado
        run: |
          found=$(git ls-files '*.jks' '*.keystore' '*.p12')
          if [ -n "$found" ]; then
            echo "Arquivo sensível versionado (repositório público):"
            echo "$found"
            exit 1
          fi

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Testes de unidade, lint e APK debug
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK debug
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
